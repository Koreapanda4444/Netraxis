name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 3
      - name: Launch application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          root = pathlib.Path('build/release')
          binary = root / ('netraxis.exe' if sys.platform == 'win32' else 'netraxis.app/Contents/MacOS/netraxis' if sys.platform == 'darwin' else 'netraxis')
          with tempfile.TemporaryDirectory() as directory:
              environment = dict(os.environ, XDG_DATA_HOME=directory, XDG_CONFIG_HOME=directory)
              report = subprocess.run([str(binary.resolve()), '--platform-report'], env=environment, capture_output=True, text=True, timeout=20)
              if report.returncode != 0:
                  raise SystemExit(f'Native interface inventory failed: {report.stdout} {report.stderr}')
              import json
              inventory = json.loads(report.stdout)
              if inventory['status'] != 'observed' or inventory['interfaces'] < 1:
                  raise SystemExit(f'Native interface inventory was not observed: {inventory}')
              process = subprocess.Popen([str(binary.resolve())], env=environment)
              try:
                  code = process.wait(timeout=3)
                  raise SystemExit(f'Application exited unexpectedly: {code}')
              except subprocess.TimeoutExpired:
                  process.terminate()
                  process.wait(timeout=10)
          PY
